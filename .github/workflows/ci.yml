name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same install and test run as publish.yml's build job, so a change
  # that breaks the suite is caught on its pull request, not at release.
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install the pinned test tools
        run: python -m pip install --require-hashes -r .github/requirements/ci.txt

      - name: Run the test suite against the repository data
        run: python -m pytest tests -q

  # The one check a ruleset needs from this workflow. It always runs and
  # fails unless every job succeeded: a skipped required check would count
  # as passing.
  ci-passed:
    name: CI passed
    if: always()
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every CI job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
