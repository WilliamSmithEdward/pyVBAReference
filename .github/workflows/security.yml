name: Security

# Static analysis (CodeQL, Semgrep) of the repository, and zizmor over the
# workflows. Malware scanning (ClamAV, YARA-X) is in malware-scan.yml.
#
# CodeQL and Semgrep report through .github/scripts/security_gate.py, which
# fails the build on any finding not accepted in
# .github/security/known-findings.toml and on any accepted entry that matched
# nothing. zizmor keeps its own exceptions (see its job). Each job also fails
# if its scanner errors.
#
# Runs on every push to main, every pull request, daily, on demand, and from
# publish.yml for every release, which attaches the resulting report.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request replaces the scan in flight. Runs on
# main, scheduled runs and release runs are never cancelled; they queue.
concurrency:
  group: ${{ github.workflow }}-security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read           # CodeQL reads workflow run metadata
      contents: read          # check out the code
      security-events: write  # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    env:
      LANGUAGE: ${{ matrix.language }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      # Results are gated and filtered before upload, so the analysis itself
      # does not upload.
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: ${{ runner.temp }}/codeql

      - name: Gate the results
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          python3 .github/scripts/security_gate.py sarif --tool codeql \
            --input "$RUNNER_TEMP/codeql/$LANGUAGE.sarif" \
            --sarif-out "$RUNNER_TEMP/codeql-filtered.sarif" \
            --report "$RUNNER_TEMP/report/codeql-$LANGUAGE.md" \
            --meta "Language=$LANGUAGE" \
            --meta "Query suite=security-extended" \
            --meta "Action=github/codeql-action v4.38.1"

      # A pull request from a fork gets a read-only token and cannot upload;
      # the gate above still decides pass or fail for it.
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ !cancelled() && !github.event.pull_request.head.repo.fork }}
        with:
          sarif_file: ${{ runner.temp }}/codeql-filtered.sarif
          category: /language:${{ matrix.language }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: security-report-codeql-${{ matrix.language }}
          path: ${{ runner.temp }}/report/
          if-no-files-found: error

  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    permissions:
      contents: read          # check out the code
      security-events: write  # upload results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image is pinned by digest in .github/security/semgrep/Dockerfile so
      # Dependabot can move it. The p/ rule sets come from the Semgrep
      # registry on every run; which ones is recorded in the report.
      - name: Scan
        run: |
          image=$(sed -n 's/^FROM //p' .github/security/semgrep/Dockerfile)
          mkdir -p "$RUNNER_TEMP/semgrep"
          chmod 0777 "$RUNNER_TEMP/semgrep"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/semgrep:/out" \
            -w /src "$image" \
            semgrep scan \
              --config p/python --config p/security-audit \
              --config p/secrets --config p/github-actions \
              --metrics off --disable-version-check \
              --sarif --output /out/semgrep.sarif .
          version=$(docker run --rm "$image" semgrep --version)
          echo "SEMGREP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Gate the results
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          python3 .github/scripts/security_gate.py sarif --tool semgrep \
            --input "$RUNNER_TEMP/semgrep/semgrep.sarif" \
            --sarif-out "$RUNNER_TEMP/semgrep-filtered.sarif" \
            --report "$RUNNER_TEMP/report/semgrep.md" \
            --meta "Version=semgrep $SEMGREP_VERSION" \
            --meta "Rule sets=p/python, p/security-audit, p/secrets, p/github-actions"

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ !cancelled() && !github.event.pull_request.head.repo.fork }}
        with:
          sarif_file: ${{ runner.temp }}/semgrep-filtered.sarif
          category: semgrep

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: security-report-semgrep
          path: ${{ runner.temp }}/report/
          if-no-files-found: error

  # zizmor audits the workflows themselves: template injection, credential
  # persistence, over-broad permissions, dangerous triggers, and actions with
  # known advisories or impostor commits. Findings it should not raise are
  # turned off in .github/zizmor.yml or ignored inline, each with its reason;
  # anything else fails the job.
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # upload results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install zizmor
        run: python -m pip install --require-hashes -r .github/requirements/zizmor.txt

      # The token lets the online audits look up advisories and check that each
      # pinned SHA belongs to the action it names.
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          zizmor --format sarif .github/workflows > zizmor.sarif || status=$?
          zizmor --format plain .github/workflows || true
          exit "$status"

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ !cancelled() }}
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  report:
    name: Security report
    needs: [codeql, semgrep]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: security-report-*
          merge-multiple: true
          path: parts

      - name: Assemble the report
        env:
          CODEQL: ${{ needs.codeql.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          overall=PASS
          for r in "$CODEQL" "$SEMGREP"; do
            [ "$r" = success ] || overall=FAIL
          done
          {
            echo "# Security report"
            echo
            echo "**Overall: $overall**"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Repository | $REPO |"
            echo "| Commit | \`$SHA\` |"
            echo "| Ref | \`$REF\` |"
            echo "| Trigger | $EVENT |"
            echo "| Generated | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| Run | $RUN_URL |"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| CodeQL | $CODEQL |"
            echo "| Semgrep | $SEMGREP |"
            echo
            echo "A finding passes only if it is accepted, with a reason, in"
            echo "[known-findings.toml](https://github.com/$REPO/blob/$SHA/.github/security/known-findings.toml)."
            echo
            for part in codeql-actions codeql-python semgrep; do
              if [ -f "parts/$part.md" ]; then
                cat "parts/$part.md"
              else
                echo "## $part"
                echo
                echo "**No report: the job did not get far enough to write one.**"
              fi
              echo
            done
          } > security-report.md
          cat security-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-report
          path: security-report.md
          if-no-files-found: error

  # The one check the ruleset requires from this workflow, so renaming or
  # adding a scan job never means editing the rules. It runs on always(),
  # never !cancelled(): a skipped required check counts as passing, so this
  # job must run - and fail - whatever happened above it.
  security-passed:
    name: Security passed
    if: always()
    needs: [codeql, semgrep, zizmor, report]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every security job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
