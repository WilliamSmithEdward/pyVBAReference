# Keeps every pin in the workflows moving. Each update waits seven days after
# release before it is proposed, and its pull request runs the Security
# workflow before it can be merged.
#
# Not covered here: the YARA-X binary and the YARA Forge rules are release
# downloads pinned in .github/security/yara.json, which
# .github/workflows/update-yara-rules.yml moves weekly. GitHub refuses
# Dependabot's image updates, so .github/workflows/update-images.yml moves
# the ClamAV and Semgrep images.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude: [pyopenvba, pyofficeeditor, pyprettyvba, vba-reference, pyvbaanalysis, pyvbaharness, xlide-mcp]
    groups:
      ci-tools:
        patterns: ["*"]
        update-types: [minor, patch]
