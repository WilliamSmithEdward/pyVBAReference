# Keeps every pin in the workflows moving. Each update waits seven days after
# release before it is proposed, and its pull request runs the Security
# workflow before it can be merged.
#
# Not covered here, because no updater can follow them:
#   - the YARA-X binary (a release download; see YARA_X_VERSION in
#     .github/workflows/security.yml for how to move it)
#   - the YARA Forge rules, which .github/workflows/yara-forge-update.yml
#     proposes weekly
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /.github/docker/clamav
      - /.github/docker/semgrep
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      ci-tools:
        patterns: ["*"]
