# Keeps every pin in the workflows moving. Each update waits seven days after
# release before it is proposed, and its pull request runs the Security
# workflow before it can be merged.
#
# Not covered here: the YARA-X binary and the YARA Forge rules are release
# downloads pinned in .github/security/yara.json, which
# .github/workflows/update-yara-rules.yml moves weekly.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /.github/security/clamav
      - /.github/security/semgrep
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      ci-tools:
        patterns: ["*"]
