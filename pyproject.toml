[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vba-reference"
version = "1.0.0"
description = "Programmatic, typed reference of the VBA object models for Excel, PowerPoint, Word, Access and the common shared COM type libraries (Office, ADO, MSXML, and more)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "William Smith" }]
keywords = ["vba", "excel", "word", "powerpoint", "access", "office", "com",
            "reference", "typelib", "macro"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/WilliamSmithEdward/pyVBAReference"
Repository = "https://github.com/WilliamSmithEdward/pyVBAReference"
Issues = "https://github.com/WilliamSmithEdward/pyVBAReference/issues"

[project.optional-dependencies]
# Only needed to regenerate the data (Windows + Microsoft Office).
generate = ["pywin32>=306"]
dev = ["pytest>=7"]

[project.scripts]
vba-ref = "vba_reference.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vba_reference"]

# Bundle the generated per-type JSON (not the Markdown, and not the
# consolidated exports, which are the same data again) inside the wheel so the
# package is self-contained once installed. The repository root keeps the
# canonical copy used in development.
[tool.hatch.build.targets.wheel.force-include]
"reference/index.json" = "vba_reference/data/index.json"
"reference/members.json" = "vba_reference/data/members.json"
"reference/excel/json" = "vba_reference/data/excel/json"
"reference/powerpoint/json" = "vba_reference/data/powerpoint/json"
"reference/word/json" = "vba_reference/data/word/json"
"reference/access/json" = "vba_reference/data/access/json"
"reference/office/json" = "vba_reference/data/office/json"
"reference/vba/json" = "vba_reference/data/vba/json"
"reference/stdole/json" = "vba_reference/data/stdole/json"
"reference/scripting/json" = "vba_reference/data/scripting/json"
"reference/msforms/json" = "vba_reference/data/msforms/json"
"reference/adodb/json" = "vba_reference/data/adodb/json"
"reference/vbide/json" = "vba_reference/data/vbide/json"
"reference/msxml/json" = "vba_reference/data/msxml/json"
"reference/winhttp/json" = "vba_reference/data/winhttp/json"

[tool.hatch.build.targets.sdist]
# The sdist ships the source, the generator, and the per-type JSON the wheel
# bundles - a wheel is built from the sdist, so anything force-included above
# has to be here or that build fails. The Markdown and the consolidated
# exports are left out: they are the same data in other shapes, and they live
# in the repository.
include = [
    "vba_reference",
    "scrape_excel_object_model.py",
    "consolidate_reference.py",
    "mslearn_docs.py",
    "tests",
    "README.md",
    "LICENSE",
    "reference/agentic_llm_primer.md",
    "reference/index.json",
    "reference/members.json",
    "reference/*/json",
]
